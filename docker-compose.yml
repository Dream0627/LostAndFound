# LAF 前后端分离部署编排：MySQL + 后端 API + 前端(Caddy)。
# 使用前：
#   1) 复制 .env.example 为 .env，填入 MySQL 口令（compose 会自动读取同目录 .env；该文件已 gitignore）。
#   2) 把 config/config.docker.yaml 的 jwt.secret 改成随机串(图片已改用相对路径，无需再配 public_base_url)；
#      其中 database.password 必须与 .env 的 MYSQL_PASSWORD 一致。
#   3) 正式前端若部署在另一台服务器：由该服务器 Caddy 反代 /api、/uploads 到后端（后端无 CORS，浏览器直连会被拦截）。
# 在线构建：docker compose up -d --build
# 停止：docker compose down        （加 -v 会连同数据卷一起删除）
# 端口规划：
#   8080 -> 后端 API（直接对外，供前端服务器 Caddy 反代访问；/uploads 图片也在此端口）
#   443  -> 临时前端 frontend-demo 的 HTTPS 站点（自签名证书，需在 .env 设置 SITE_ADDRESS）
#   9090 -> 容器内 80，仅用于把旧的 http 地址重定向到 https
# 服务器需在安全组放行 443。
services:
  mysql:
    image: mysql:8.0
    container_name: laf-mysql
    restart: unless-stopped
    environment:
      # 口令来自 .env（禁止把真实口令写进本文件并提交）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laf_db}
      MYSQL_USER: ${MYSQL_USER:-laf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动执行建表脚本。
      - ./migrations/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
    healthcheck:
      # 用 CMD-SHELL 展开容器内的 MYSQL_ROOT_PASSWORD，避免口令出现在编排文件里。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: laf-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    # 前后端分离：后端直接映射到宿主机 8080 对外提供 API 与 /uploads 图片，
    # 由前端服务器 Caddy 反代访问（后端无 CORS，浏览器直连会被拦截）。
    ports:
      - "8080:8080"
    volumes:
      # 用宿主机配置覆盖镜像内路径；其中 database.host 已填 mysql。
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
      # 上传的帖子图片持久化，重建容器不丢。
      - uploads:/app/uploads

  frontend:
    image: laf-frontend:latest
    build:
      context: ./frontend-demo
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: laf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 服务器公网 IP：Caddy 用它签发自签名证书（见 frontend-demo/Caddyfile）。
      # 在 .env 中设置，避免真实 IP 进入仓库。
      SITE_ADDRESS: ${SITE_ADDRESS:?请在 .env 中设置 SITE_ADDRESS=<服务器公网IP>}
    # 443 -> HTTPS 站点（自签名，浏览器提示"不安全"，点继续访问后一键定位可用）；
    # 9090 -> 容器内 80，Caddy 会自动把 http 请求重定向到 https。
    # 注意：阿里云安全组需放行 443。
    ports:
      - "443:443"
      - "9090:80"

volumes:
  mysql_data:
  uploads:
