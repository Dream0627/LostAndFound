server:
  port: YourPort
  cors_allow_origins:
    - "http://localhost:5173"
    - "http://localhost:9090"
  # 注册管理员时需要出示的暗号；生产环境请改成复杂值。
  admin_secret: "YourAdminSecret"

database:
  enabled: true
  host: YourHost
  port: YourPort
  username: YourUsername
  password: YourPassword
  name: laf_db 
#统一使用该数据库名称

jwt:
  secret: YourSecret
  issuer: YourIssuer
  expires: YourExpires