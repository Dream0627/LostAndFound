# LAF 前端站点的 Nginx 配置：托管 SPA 静态资源，并同源反代后端接口与上传目录。
# 同源反代可让浏览器不触发跨域(CORS)，也无需后端额外放开来源。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 帖子图片可能较大，放宽上传体积限制。
    client_max_body_size 20m;

    # 后端 API：/api/v1/... 原样转发到后端容器 8080。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 帖子图片：/uploads/... 转发到后端静态资源。
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 前端路由(history 模式)：找不到实体文件时回退到 index.html，避免刷新 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}